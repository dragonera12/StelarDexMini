name: Stellar DEX Mini CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contracts:
    name: Contracts Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: Build Contracts
        run: |
          # 1. Build the token dependency first
          cargo build --package token --target wasm32-unknown-unknown --release
          
          # 2. Satisfy the pool contract's import path requirement
          mkdir -p target/wasm32v1-none/release
          cp target/wasm32-unknown-unknown/release/token.wasm target/wasm32v1-none/release/token.wasm
          
          # 3. Build the pool contract
          cargo build --package pool --target wasm32-unknown-unknown --release
        working-directory: ./contracts

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      - name: Install Dependencies
        run: npm install
        working-directory: ./frontend
      - name: Build
        run: npm run build
        working-directory: ./frontend
