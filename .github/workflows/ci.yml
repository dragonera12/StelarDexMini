name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node_modules-cache: 'npm'
        node-version: '20'

    - name: Install Dependencies
      run: cd frontend && npm install

    - name: Build Frontend
      run: cd frontend && npm run build
